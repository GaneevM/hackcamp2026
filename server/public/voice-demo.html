<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice companion test</title>
  <style>
    body {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 20px;
      font-family: system-ui, sans-serif;
      background: #f7f6ef;
      color: #20382a;
    }
    button, select {
      padding: 14px 18px;
      margin: 6px;
      font: inherit;
      cursor: pointer;
    }
    #message {
      padding: 20px;
      background: white;
      border-radius: 12px;
      min-height: 60px;
    }
    #status { min-height: 30px; }
  </style>
</head>
<body>
  <h1>Voice companion test</h1>
  <p>
    Simulation only. Buttons represent events that the tracking
    system will eventually provide.
  </p>
  <p>
    Audio was generated by Gemini in advance. Playback does not
    call Gemini or save sessions.
  </p>

  <label for="mode">Speaking mode:</label>
  <select id="mode" disabled>
    <option value="concise">Concise</option>
    <option value="encouraging">Encouraging</option>
    <option value="quiet">Quiet</option>
  </select>

  <p id="status" role="status">Loading audio…</p>

  <div>
    <button disabled data-event="session_started">Session started</button>
    <button disabled data-event="rep_completed">Rep completed</button>
    <button disabled data-event="tracking_lost">Tracking lost</button>
    <button disabled data-event="tracking_restored">Tracking restored</button>
    <button disabled data-event="session_ended">Session ended</button>
  </div>

  <p id="message" aria-live="polite">Loading speaking modes…</p>
  <button id="stop">Stop speaking</button>

  <script type="module">
    const status = document.querySelector("#status");
    const message = document.querySelector("#message");
    const modeSelect = document.querySelector("#mode");
    const buttons = document.querySelectorAll("[data-event]");
    const modes = new Map();
    const objectUrls = [];

    let currentAudio = null;
    let playbackVersion = 0;

    function stopSpeaking() {
      playbackVersion++;

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
    }

    document.querySelector("#stop").addEventListener("click", () => {
      stopSpeaking();
      status.textContent = "Speech stopped.";
    });

    modeSelect.addEventListener("change", () => {
      stopSpeaking();
      status.textContent = "Ready. Mode: " + modeSelect.value;
      message.textContent =
        modeSelect.value === "quiet"
          ? "Quiet mode speaks only for tracking loss."
          : "Choose a simulated event.";
    });

    async function loadMode(mode) {
      const response = await fetch(`/voice-assets/${mode}.json`);

      if (!response.ok) {
        throw new Error(`Could not load ${mode} mode.`);
      }

      const manifest = await response.json();
      const clips = new Map();

      await Promise.all(
        Object.entries(manifest.clips).map(async ([event, clip]) => {
          if (clip === null) {
            clips.set(event, null);
            return;
          }

          const response = await fetch(
            "/voice-assets/" + encodeURIComponent(clip.fileName)
          );

          if (!response.ok) {
            throw new Error(`Could not load ${mode}: ${event}.`);
          }

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          objectUrls.push(url);

          const audio = new Audio(url);
          audio.preload = "auto";

          clips.set(event, { text: clip.text, audio });
        })
      );

      modes.set(mode, clips);
    }

    for (const button of buttons) {
      button.addEventListener("click", async () => {
        stopSpeaking();

        const clips = modes.get(modeSelect.value);
        const event = button.dataset.event;

        if (!clips?.has(event)) {
          status.textContent = "This event is unavailable.";
          return;
        }

        const clip = clips.get(event);

        if (clip === null) {
          message.textContent =
            button.textContent + " — no spoken message in quiet mode.";
          status.textContent = "Event received. Staying silent.";
          return;
        }

        const version = playbackVersion;

        message.textContent = clip.text;
        currentAudio = clip.audio;
        status.textContent = "Playing: " + button.textContent;

        clip.audio.onended = () => {
          if (version === playbackVersion) {
            currentAudio = null;
            status.textContent = "Ready.";
          }
        };

        try {
          await clip.audio.play();
        } catch {
          if (version === playbackVersion) {
            currentAudio = null;
            status.textContent =
              "Playback failed. Check browser audio permissions.";
          }
        }
      });
    }

    window.addEventListener("beforeunload", () => {
      stopSpeaking();
      objectUrls.forEach((url) => URL.revokeObjectURL(url));
    });

    Promise.all(
      ["concise", "encouraging", "quiet"].map(loadMode)
    ).then(() => {
      modeSelect.disabled = false;
      buttons.forEach((button) => {
        button.disabled = false;
      });

      status.textContent = "Ready. All three modes are downloaded.";
      message.textContent = "Choose a simulated event.";
    }).catch((error) => {
      status.textContent = error.message;
    });
  </script>
</body>
</html>
