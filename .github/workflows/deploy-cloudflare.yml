name: Deploy Formnote to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "redesign.css"
      - "app.js"
      - "companion.js"
      - "session-metrics.js"
      - "rep-sound.js"
      - "care-pages.js"
      - "care-data.js"
      - "auth0-config.js"
      - "_headers"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare deployment configuration
        id: config
        env:
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          // Values committed in auth0-config.js are the default. The GitHub variables
          // AUTH0_DOMAIN and AUTH0_CLIENT_ID override them when they are set.
          let committed = { domain: '', clientId: '' };
          try {
            const text = fs.readFileSync('auth0-config.js', 'utf8');
            committed = {
              domain: (/domain:\s*'([^']*)'/.exec(text) || [])[1] || '',
              clientId: (/clientId:\s*'([^']*)'/.exec(text) || [])[1] || '',
            };
          } catch {}
          const domain = (process.env.AUTH0_DOMAIN || '').trim() || committed.domain;
          const clientId = (process.env.AUTH0_CLIENT_ID || '').trim() || committed.clientId;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          const apiToken = process.env.CLOUDFLARE_API_TOKEN || '';
          if (!accountId || !apiToken) {
            console.log('::notice::Deployment skipped. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as Actions secrets.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=false\n');
            process.exit(0);
          }
          const config = { domain, clientId };
          const contents = `window.FORMNOTE_AUTH0_CONFIG = ${JSON.stringify(config)};\n` +
            `if (window.FORMNOTE_AUTH0_CONFIG.domain && window.FORMNOTE_AUTH0_CONFIG.clientId) { document.documentElement.classList.add('auth-enabled'); }\n`;
          fs.writeFileSync('auth0-config.js', contents);
          fs.rmSync('dist', { recursive: true, force: true });
          fs.mkdirSync('dist', { recursive: true });
          for (const file of ['index.html', 'styles.css', 'redesign.css', 'app.js', 'companion.js', 'session-metrics.js', 'rep-sound.js', 'care-pages.js', 'care-data.js', 'auth0-config.js', '_headers']) {
            fs.copyFileSync(file, `dist/${file}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
          NODE

      - name: Deploy static frontend
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
