name: Deploy Formnote to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formnote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test authentication, build and exercise logic
        run: node --test tests/*.test.mjs pushup.test.mjs
      - name: Build frontend with validated public settings
        env:
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
        run: node scripts/build.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --input-type=module -e "import {requireCredentials} from './scripts/build.mjs'; requireCredentials(process.env)"
      - name: Prepare deployment configuration
        env:
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
        run: node scripts/build.mjs
      - name: Install backend dependencies
        run: npm ci --prefix server
      - name: Deploy frontend and API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.connected.jsonc --keep-vars
      - name: Verify live assets and authentication configuration
        run: node scripts/smoke.mjs
      - name: Deployment status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Deployment status: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: physipeak" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "A release is verified only when publishing AND the live smoke check pass." >> "$GITHUB_STEP_SUMMARY"
